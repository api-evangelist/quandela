  - name: Quandela Quantum Toolbox API
    description: >-
      Quandela's pre-built quantum primitives, published as a separate
      specification at https://api.cloud.quandela.com/qt-openapi.json. Five
      fully typed algorithms — Chemistry VQE, Custom VQE, CVaR VQE, Graph DSI
      and Graph Isomorphism — each with dedicated params, status, intermediate
      result and result schemas, and each paired with an /estimate operation
      that returns nb_iterations / nb_shots_per_job / nb_total_shots without
      running the workload or spending credits. Also carries the Entropy QRNG,
      the only synchronous operations on the platform, whose draws return CHSH
      and min-entropy certification alongside the values. Unlike Perceval job
      submission, this surface is callable directly over HTTP with no SDK.
