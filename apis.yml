x-pointers-deliberately-withheld:
  note: >-
    Recorded so a later run does not "fix" these as omissions. Each artifact
    below EXISTS in this repository and documents an ABSENCE; emitting its
    canonical scored pointer would assert that Quandela serves a surface it does
    not serve.
  withheld:
    - type: WellKnown
      artifact: well-known/quandela-well-known.yml
      reason: >-
        Every /.well-known/ path 404s on the three real hosts. The three 200s
        recorded are SPA catch-all HTML shells, not documents. The probe is kept
        as data under the non-scored type WellKnownProbe.
    - type: SecurityTxt
      artifact: well-known/quandela-well-known.yml
      reason: /.well-known/security.txt returns 404 everywhere.
    - type: MCPServer
      artifact: mcp/quandela-mcp.yml
      reason: >-
        No MCP server exists — /mcp 404s, mcp.quandela.com does not resolve, npm
        has no Quandela package. The file is a DERIVED candidate tool list with
        deployment.mode = none, kept under the non-scored type MCPCandidate.
    - type: AgentCard
      artifact: null
      reason: >-
        No agent card. /.well-known/agent-card.json and /.well-known/agent.json
        404 on every real host. Nothing was written — this artifact is never
        authored on a provider's behalf.
    - type: Idempotency
      artifact: conventions/quandela-conventions.yml
      reason: >-
        Zero occurrences of "idempoten" across the 59-operation contract.
        process_id on POST /api/jobs is a uniqueness guard that 400s on
        collision, not idempotent replay.
    - type: Deprecation
      artifact: lifecycle/quandela-lifecycle.yml
      reason: >-
        10 operations carry deprecated:true in the spec, but there is no
        deprecation-policy page, no sunset date and no RFC 8594 Sunset or
        Deprecation header.
    - type: Compliance
      artifact: conformance/quandela-conformance.yml
      reason: >-
        No certification or compliance program is published — no trust centre
        and no named certification anywhere on the public surface.
    - type: Security
      artifact: null
      reason: >-
        No vulnerability disclosure policy, no security.txt, no bug bounty.
        probe-security-programs.py returned vdp=none trust=none.
    - type: AsyncAPI
      artifact: null
      reason: >-
        No event surface at all. /asyncapi.yaml, /asyncapi.json, /events and
        /webhooks all 404 on the API host; the API is submit-then-poll.
    - type: Webhooks
      artifact: null
      reason: No callback or webhook operation in the contract.
    - type: APIReference
      artifact: null
      reason: >-
        https://api.cloud.quandela.com/api/docs/ 302-redirects to
        account.quandela.com/login — the rendered reference is behind
        authentication, so it is not a publicly readable API reference. The
        OpenAPI at /openapi.json is public and is wired as OpenAPI instead.
    - type: CLI
      artifact: null
      reason: Quandela ships no first-party CLI.
    - type: Components
      artifact: null
      reason: Quandela ships no embeddable UI components.
    - type: OAuthScopes
      artifact: null
      reason: >-
        No oauth2 securityScheme and no scopes model — a Cloud Job Token is
        all-or-nothing within its commercial offer.
    - type: Postman
      artifact: null
      reason: >-
        No first-party public collection. The only Postman search hit for
        "quandela" is an unrelated third-party workspace ("candela_2025").
    - type: Protobuf
      artifact: null
      reason: >-
        No .proto in the 15-repo github.com/Quandela org. QDMI-Perceval
        implements the C++ Quantum Device Management Interface, a native C ABI.
