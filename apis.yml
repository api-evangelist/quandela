apis:
  - name: Quandela Cloud API
    description: >-
      The core Quandela Cloud REST surface — Perceval job submission,
      status/result polling, cancel and rerun, plus the full Cloud Job Token
      lifecycle (create, list, read, update, revoke, reopen, delete) and a
      per-platform consumption ledger separating credits from free credits.
      Submit-then-poll only: there is no webhook, callback or event surface. Ten
      of the operations in this contract are marked deprecated (singular legacy
      paths superseded by plural successors) with no published sunset dates.
    humanURL: https://cloud.quandela.com/
