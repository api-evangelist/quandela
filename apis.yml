aid: quandela
name: Quandela
description: >-
  Quandela is a Paris-region (Massy, France) photonic quantum computing company
  building modular, scalable, energy-efficient quantum systems driven by
  deterministic single-photon sources. Its hardware lineup includes Ascella (its
  first cloud-accessible system), Belenos (a 12-qubit second-generation machine),
  Canopus, and Mosaiq (its flagship prototyping platform), alongside Prometheus
  single-photon sources and the Entropy quantum random number generator.
  Quandela develops Perceval, the open-source Python framework for programming
  photonic quantum computers, distributed on PyPI as perceval-quandela with the
  perceval-interop bridges to Qiskit, QuTiP, cQASM and myQLM and the exqalibur
  native optimisation kernel. It operates Quandela Cloud, which — contrary to an
  earlier reading of this profile — DOES publish a real, anonymously readable
  REST contract: OpenAPI 3.0.3 at https://api.cloud.quandela.com/openapi.json,
  version v2.8.0-rc4, with 55 paths, 59 operations and 54 component schemas,
  plus a Quantum Toolbox sub-specification at /qt-openapi.json. The surface
  covers Perceval job submission (submit-then-poll, with the circuit carried as
  an SDK-serialised opaque payload), a self-service Cloud Job Token lifecycle
  with a per-platform credit ledger, five typed Quantum Toolbox primitives
  (Chemistry VQE, Custom VQE, CVaR VQE, Graph DSI, Graph Isomorphism) each with
  a paired cost estimator, and the Entropy QRNG, whose draws return CHSH and
  min-entropy certification. Authentication is a single declared bearer scheme
  covering two distinct credentials — an account token from account.quandela.com
  and a Cloud Job Token minted over the API. Quandela also runs a Quantum
  Acceleration Program for enterprise pilots in cybersecurity, pharma,
  chemistry, logistics, finance, energy and aerospace, and publishes a 2024-2030
  roadmap to fault-tolerant quantum computing.
