  - version: v1.2.4
    date: '2026-07-02'
    url: https://github.com/Quandela/Perceval/releases/tag/v1.2.4
    breaking: false
    additions:
      - >-
        New KipuSession, allowing jobs to be sent to the Kipu Quantum Hub
        (requires `pip install perceval-quandela[kipu]`) — a second cloud
        provider target alongside Quandela Cloud.
    improvements:
      - GenericInterferometer now accepts a str as interferometer shape.
  - version: v1.2.3
    date: '2026-06-17'
    url: https://github.com/Quandela/Perceval/releases/tag/v1.2.3
    breaking: true
    breaking_changes:
      - >-
        BSDistribution internal representation changed; it must now be imported
        from perceval and no longer from exqalibur.
    additions:
      - Arithmetic operations on BSDistribution (+ and - between same-mode distributions, * and / with floats).
    improvements:
      - HTTP error messages from the cloud API are clearer.
  - version: v1.2.2
    date: '2026-06-04'
    url: https://github.com/Quandela/Perceval/releases/tag/v1.2.2
    breaking: false
    improvements:
      - Sped up creation of BS components.
    fixes:
      - Fixed Sampler iterations crashing when used with a RemoteProcessor.
      - Numeric overflows in backend computations are now properly caught and raised.
  - version: v1.2.1
    date: '2026-05-20'
    name: The Royal Court
    url: https://github.com/Quandela/Perceval/releases/tag/v1.2.1
    breaking: false
    additions:
      - Main computation classes ported to Exqalibur; SLOS and both simulators now default to Exqalibur.
      - RemoteProcessor.get_current_noise() returns a NoiseModel reflecting current platform performance.
      - RemoteProcessor specs are now a dedicated object type guaranteeing field availability.
      - Fourier interferometers constructible via a Unitary helper method.
    improvements:
      - postselect can now be changed within a Sampler's iterations.
      - Unitary.random() helper added.
  - version: v1.1.0
    date: '2025-11-20'
    name: The Round Table
    url: https://github.com/Quandela/Perceval/releases/tag/v1.1.0
    breaking: false
    additions:
      - Python 3.14 support.
      - >-
        JobGroup gains launch_async_jobs / relaunch_async_failed_jobs and
        cancel_all; grouped jobs are now grouped in the Quandela Cloud UI by
        JobGroup name.
      - PPNR detectors gain a wire_efficiency parameter.
      - The cloud target URL can now be saved in RemoteConfig.
    improvements:
      - HTTP errors from RemoteProcessor / RemoteJob are more explicit.
      - PersistentData folder configurable via PCVL_PERSISTENT_PATH.
  - version: v1.0.1
    date: '2025-09-22'
    name: The Grail Encounter
    url: https://github.com/Quandela/Perceval/releases/tag/v1.0.1
    breaking: false
    improvements:
      - Legacy docs clarified NoisyFockState format for distinguishability noise.
    fixes:
      - Fixed Expression/Parameter copy and Circuit/Experiment copy with repeated Parameters.
      - Simulator no longer accepts AnnotatedFockState inputs where invalid.
      - BasicState can be initialised from a numpy.array again.
  - version: v1.0.0
    date: '2025-09-04'
    name: The Grail Encounter
    url: https://github.com/Quandela/Perceval/releases/tag/v1.0.0
    breaking: true
    note: First 1.0 release of Perceval.
