note: >-
  Quandela publishes NO changelog for the Quandela Cloud REST API itself. There
  is no dated release-notes page for api.cloud.quandela.com, no CHANGELOG.md in
  any Quandela repository (probed: Quandela/Perceval/CHANGELOG.md -> 404), and
  no changelog entry in the Perceval documentation navigation. The API's only
  version marker is `info.version: v2.8.0-rc4` inside
  https://api.cloud.quandela.com/openapi.json, with no history behind it — so
  the 10 deprecated operations in the current contract have no announcement
  trail. What IS published, and what is captured below, is a real dated
  changelog for the FIRST-PARTY CLIENT: GitHub Releases on Quandela/Perceval,
  the Python SDK through which the cloud surface is actually consumed. Release
  notes are structured under explicit "New features" / "Improvements" /
  "Breaking changes" / "Bug fixes" headings, which makes them genuinely usable
  for change review.
