note: >-
  Cross-cutting runtime semantics of the Quandela Cloud API, derived from
  Quandela's own published OpenAPI and confirmed against live anonymous
  responses. The API-reference UI at https://api.cloud.quandela.com/api/docs/
  302-redirects to account.quandela.com/login, so the specification itself is
  the only readable normative description of these conventions.
base_url: https://api.cloud.quandela.com/
authentication:
  style: bearer-token
  header: 'Authorization: Bearer <token>'
  scheme_name: BearerAuth
  spec_text: >-
    "All endpoints require an access token generated by the authorization
    server. Include the token in the request headers: Authorization: Bearer
    YOUR_ACCESS_TOKEN. Ensure the token is valid and not expired."
  two_token_classes:
    - name: account access token
      issued_by: account.quandela.com (the authorization server)
      used_on: /api/auth/tokens* and /api/tokens* token-administration endpoints
      failure: '401 ''{"detail":{},"error":"Authentication and authorization failed: token not found"}'''
    - name: Cloud Job Token
      issued_by: POST /api/tokens (or POST /api/auth/tokens)
      used_on: >-
        the job-execution surface — the tags "Api - Perceval Job",
        "Api - Perceval Job Token" and the /qt/* Quantum Toolbox and QRNG
        operations, whose tag descriptions read "Authenticate by `Cloud Job Token`"
      failure: 401 '{"detail":{},"error":"Invalid or expired job token"}'
      lifecycle: generate -> revoke -> reopen -> delete, with labels and expiry
  oauth2: false
  scopes: false
  detail: authentication/quandela-authentication.yml
idempotency:
  supported: false
  header: null
  note: >-
    NO IDEMPOTENCY CONTRACT. There is no Idempotency-Key header, parameter or
    equivalent anywhere in the 59-operation spec (case-insensitive search for
    "idempoten" across the published openapi.json returns zero matches). The
    nearest facility is the caller-supplied `process_id` on POST /api/jobs,
    but a collision returns 400 "process_id is existed and assigned to another
    user job" rather than replaying the original response, so it is a uniqueness
    guard, not idempotent replay. A retried job submission after a timeout can
    therefore consume credits twice. No `Idempotency` pointer is emitted in
    apis.yml.
