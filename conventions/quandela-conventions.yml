  cursor: false
async_pattern:
  style: submit-then-poll
  note: >-
    The defining convention of this API. Every quantum workload is asynchronous
    and is driven entirely by client polling; there is no callback, webhook,
    SSE or streaming surface (see asyncapi/ — absent).
  perceval_flow:
    submit: POST /api/jobs -> JobId
    poll_status: GET /api/jobs/{job_id}/status -> JobStatusResponse
    fetch_result: GET /api/jobs/{job_id}/result -> JobResult
    fetch_payload: GET /api/jobs/{job_id}/data
    cancel: POST /api/jobs/{job_id}/cancel
    rerun: POST /api/jobs/{job_id}/rerun
  quantum_toolbox_flow:
    estimate: POST /qt/<algorithm>/estimate   # cost/feasibility pre-flight before spending credits
    submit: POST /qt/<algorithm> -> QTJobId
    poll_status: GET /qt/<algorithm>/{job_id}/status
    fetch_result: GET /qt/<algorithm>/{job_id}/results
  estimate_before_submit: >-
    Each of the five Quantum Toolbox algorithms publishes a paired
    /estimate operation. This is an unusual and genuinely agent-friendly
    convention: an agent can price a workload before committing credits.
  intermediate_results: >-
    The VQE algorithms expose Intermediate*VqeResults schemas, so status polls
    can return partial optimisation traces before the job terminates.
