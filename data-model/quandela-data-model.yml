note: >-
  The Quandela Cloud data model is small and job-centric: four core entities
  (Platform, Token, Job, Result) plus two parallel job families — Perceval jobs
  (arbitrary photonic circuits submitted as an opaque payload) and Quantum
  Toolbox jobs (five named algorithms with typed parameter and result schemas).
  Relationships are expressed by scalar id/name reference fields rather than by
  nested $ref objects, so most edges below are derived from field naming
  (`platform_id`, `platform_name`, `token_id`, `job_id`, `rerun_from`) and are
  marked as such.
