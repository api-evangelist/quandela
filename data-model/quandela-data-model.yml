  platform_name:
    type: namespaced-string
    pattern: '<type>:<name>'
    examples: ['qpu:belenos', 'qpu:ascella', 'sim:slos']
    note: >-
      The type prefix is semantically load-bearing — `qpu:` is real hardware
      that consumes credits, `sim:` is a simulator. An agent must read the
      prefix before submitting.
  process_id:
    type: string
    optional: true
    note: Caller-supplied. Unique across users; NOT an idempotency key.
