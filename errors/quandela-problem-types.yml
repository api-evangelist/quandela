gaps:
  - No machine-readable error code member; agents must string-match on `error`.
  - No RFC 9457 `application/problem+json` representation.
  - >-
    Quota and billing exhaustion ("Not enough credits") is signalled as 401,
    conflating authentication failure with payment/quota failure — an agent
    that retries 401 by refreshing its token will loop forever.
  - No 429 status anywhere in the spec; concurrency ceilings surface as 400/403.
  - No `Retry-After` header defined on any response.
