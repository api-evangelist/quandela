format: vendor-json
rfc9457: false
note: >-
  Quandela does NOT use RFC 9457 problem+json. Every error is
  `application/json` shaped as the `HTTPError` schema — a flat
  `{detail, error}` object with no `type`, `title` or `instance` member and no
  stable machine-readable error code. `error` carries a human-readable English
  sentence and `detail` is a free-form object (populated only for 400/422
  validation failures, where it nests location -> field -> [messages]). An
  agent must therefore branch on HTTP status plus string matching, which is the
  single largest error-semantics gap on this API.
envelope:
  schema: HTTPError
  content_type: application/json
  fields:
    - name: error
      type: string
      description: Human-readable message. The only discriminator available for same-status failures.
    - name: detail
      type: object
      description: >-
        Free-form. Empty object `{}` on auth/not-found errors; on 400/422 it is
        the ValidationError shape `{"<location>": {"<field_name>": ["message"]}}`.
  observed_examples:
    - probe: GET https://api.cloud.quandela.com/api/platforms
      status: 401
      body: '{"detail":{},"error":"Authentication and authorization failed: token not found"}'
    - probe: GET https://api.cloud.quandela.com/api/jobs/availability
      status: 401
      body: '{"detail":{},"error":"Invalid or expired job token"}'
    - probe: GET https://api.cloud.quandela.com/api/pricing
      status: 404
      body: >-
        {"detail":{},"error":"The requested URL was not found on the server. If
        you entered the URL manually please check your spelling and try again."}
    - probe: 'GET https://api.cloud.quandela.com/qt/qrng/ints?count=4&type=int8'
      status: 400
      body: '{"detail":{"query":{"type":["Must be one of: uint8, uint16, uint32, uint64."]}},"error":"Bad Request"}'
