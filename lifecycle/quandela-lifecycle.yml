  in_spec_signalling: true
  note: >-
    Quandela DOES mark deprecation in the machine-readable contract: 10 of 59
    operations carry `deprecated: true` and prefix their summary with
    "DEPRECATED:". That is real, useful signalling. What is missing is the
    policy around it — there is no deprecation-policy page, no announced sunset
    date for any of the 10, no RFC 8594 Sunset or Deprecation response header
    defined on any operation, and no changelog entry explaining the migration.
    Because no policy document exists, no `Deprecation` pointer is emitted in
    apis.yml.
