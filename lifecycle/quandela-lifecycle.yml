status_page:
  hosted_page: null
  machine_readable: https://api.cloud.quandela.com/api/platforms/public
  method: probed
  probed: '2026-08-17'
  http_status: 200
  auth: none
  note: >-
    Quandela publishes no hosted human status page — status.quandela.com does
    not resolve (DNS failure) and quandela.statuspage.io returns the Atlassian
    Statuspage marketing site, not a Quandela page. What it DOES publish, and
    what the StatusPage pointer in apis.yml points at, is a machine-readable
    per-platform status feed served anonymously from its own API host. Each
    entry carries a QPU `name`, a `status`, a `maintenance` window with
    start_time/end_time, and a `statistic` map of daily availability
    percentages for the trailing ~8 days. That is a genuine, provider-served
    operational-transparency surface — arguably a stronger one than a hosted
    incident page, since an agent can consume it directly. It is undocumented:
    it does not appear in the published openapi.json.
