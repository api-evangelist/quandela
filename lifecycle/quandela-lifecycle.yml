    Singular legacy path deprecated in favour of a plural successor, with the
    action moved from a path segment to a sub-resource:
    /api/job -> /api/jobs, /api/job/cancel/{id} -> /api/jobs/{id}/cancel,
    /api/auth/token -> /api/auth/tokens.
