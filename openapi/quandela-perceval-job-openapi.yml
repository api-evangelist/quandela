components:
  schemas:
    DefaultResponse:
      additionalProperties: true
      properties:
        message:
          example: ok
          nullable: true
          type: string
      type: object
    GetJobDataResonse:
      additionalProperties: true
      properties:
        command:
          nullable: true
          type: string
        created_date:
          format: date-time
          nullable: true
          type: string
        duration:
          nullable: true
          type: integer
        failure_code:
          nullable: true
          type: string
        job_id:
          nullable: true
          type: string
        job_name:
          nullable: true
          type: string
        payload:
          nullable: true
          readOnly: true
        pcvl_version:
          nullable: true
          type: string
        platform_id:
          nullable: true
          type: string
        platform_name:
          nullable: true
          type: string
        process_id:
          nullable: true
          type: string
        rerun_from:
          nullable: true
          type: string
        shots:
          nullable: true
          type: integer
        start_time:
          format: date-time
          nullable: true
          type: string
        status:
          nullable: true
          type: string
        token_id:
          nullable: true
          type: integer
        token_label:
          nullable: true
          type: string
      type: object
    HTTPError:
      properties:
        detail:
          type: object
        error:
          type: string
      type: object
    JobAvailabilityResponse:
      additionalProperties: true
      properties:
        max_concurrent_jobs:
          nullable: true
          type: integer
        max_jobs_in_queue:
          nullable: true
          type: integer
        max_running_qt_jobs:
          nullable: true
          type: integer
        num_concurrent_jobs:
          nullable: true
          type: integer
        num_jobs_in_queue:
          nullable: true
          type: integer
        num_running_qt_jobs:
          nullable: true
          type: integer
      type: object
    JobCreate:
      additionalProperties: true
      properties:
        job_group_name:
          description: Job group name to create
          example: Job Group Name 1
          nullable: true
          type: string
        job_name:
          description: Job name to create
          example: Job Name 1
          type: string
        max_duration:
          description: Max duration of the job in seconds
          example: 60
          nullable: true
          type: integer
        payload:
          additionalProperties: {}
          description: Payload to create job
          example:
            key: value
          nullable: true
          type: object
        pcvl_version:
          description: PCVL version, will be passed in `payload`
          example: 1.0.0
          nullable: true
          type: string
        platform_id:
          description: Platform ID
          example: 05cfb499-1789-41ac-8653-eb78039b76a2
          nullable: true
          type: string
        platform_name:
          description: Platform name use when platform_id is not provided
          example: Platform Name 1
          nullable: true
          type: string
        process_id:
          description: Process ID
          example: 05cfb499-1789-41ac-8653-eb78039b76a2
          nullable: true
          type: string
      required:
      - job_name
      - payload
      type: object
    JobId:
      additionalProperties: true
      properties:
        job_id:
          description: Job ID of the created job
          example: 05cfb499-1789-41ac-8653-eb78039b76a2
          nullable: true
          type: string
      type: object
    JobResult:
      additionalProperties: true
      properties:
        duration:
          description: Duration
          example: 1
          nullable: true
          type: integer
        intermediate_results:
          description: Intermediate Results
          items:
            additionalProperties: {}
            example:
              key: value
            type: object
          nullable: true
          type: array
        job_id:
          description: Job ID
          example: 5f8b9b0c-4b1c-4b1c-9b0c-4b1c4b1c4b1c
          nullable: true
          type: string
        results:
          description: Result as JSON string
          example: '{"key":"value"}'
          nullable: true
          type: string
        results_type:
          description: Job result type
          example: test
          nullable: true
          type: string
        shots:
          description: Number of shots
          example: 100
          nullable: true
          type: integer
      type: object
    JobStatusResponse:
      additionalProperties: true
      properties:
        creation_datetime:
          description: Job creation time
          nullable: true
          type: number
        duration:
          description: Job duration in seconds
          example: 60
          nullable: true
          type: integer
        failure_code:
          description: Job failure code
          example: error
          nullable: true
          type: string
        last_intermediate_results:
          additionalProperties: {}
          description: Last intermediate results
          example:
            key: value
          nullable: true
          type: object
        msg:
          description: Message
          example: ok
          nullable: true
          type: string
        progress:
          description: Job progress in percentage
          example: 50
          nullable: true
          type: number
        progress_message:
          description: Job progress message
          example: Job is running
          nullable: true
          type: string
        shots:
          description: Shots
          example: 1
          nullable: true
          type: integer
        start_time:
          description: Job start time
          nullable: true
          type: number
        status:
          description: Job status
          example: waiting
          nullable: true
          type: string
        status_message:
          description: Job status message
          example: Job is running
          nullable: true
          type: string
      type: object
    RerunJob:
      additionalProperties: true
