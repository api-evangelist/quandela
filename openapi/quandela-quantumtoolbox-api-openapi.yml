components:
  schemas:
    IntermediateGraphDSIResults:
      additionalProperties: false
      properties:
        estimation:
          $ref: '#/components/schemas/EstimationResult1'
        subgraphs_density:
          additionalProperties:
            type: integer
          type: object
        timestamp:
          type: number
      type: object
    GraphIsomorphismJobStatus:
      additionalProperties: false
      properties:
        duration:
          description: Duration in seconds
          example: 42
          type: integer
        last_intermediate_results:
          $ref: '#/components/schemas/IntermediateGraphIsomorphismResults'
        progress:
          example: 0.7
          type: number
        progress_message:
          description: detailed message
          type: string
        status:
          description: Status code
          enum:
          - waiting
          - running
          - canceled
          - completed
          - error
          example: running
          type: string
        status_message:
          description: detailed message
          type: string
      required:
      - duration
      type: object
    CustomVqeResults:
      additionalProperties: false
      properties:
        estimation:
          $ref: '#/components/schemas/EstimationResult'
        loss:
          type: number
      required:
      - loss
      type: object
    CustomVQEJobResult:
      additionalProperties: false
      properties:
        duration:
          description: Duration in seconds
          example: 42
          type: integer
        intermediate_results:
          description: Results with timestamps
          items:
            $ref: '#/components/schemas/IntermediateCustomVqeResults'
          type: array
        job_id:
          type: string
        progress:
          example: 0.7
          type: number
        progress_message:
          description: detailed message
          type: string
        results:
          $ref: '#/components/schemas/CustomVqeResults'
        status:
          description: Status code
          enum:
          - waiting
          - running
          - canceled
          - completed
          - error
          example: running
          type: string
        status_message:
          description: detailed message
          type: string
      required:
      - duration
      - job_id
      type: object
    Atom:
      additionalProperties: false
      properties:
        coordinates:
          items:
            type: number
          maxItems: 3
          minItems: 3
          type: array
        element:
          type: string
      required:
      - coordinates
      - element
      type: object
    CVarVqeResults:
      additionalProperties: false
      properties:
        bitstring:
          type: string
        estimation:
          $ref: '#/components/schemas/EstimationResult'
        loss:
          type: number
      required:
      - bitstring
      - loss
      type: object
    IntermediateChemistryVqeResults:
      additionalProperties: false
      properties:
        difference_with_theoretical_value:
          type: number
        estimation:
          $ref: '#/components/schemas/EstimationResult'
        loss:
          type: number
        timestamp:
          type: number
      required:
      - difference_with_theoretical_value
      - loss
      type: object
    CustomVqeParams:
      additionalProperties: false
      properties:
        hamiltonian_strings:
          example:
          - XIIX
          - ZZYY
          - ZXYY
          - ZZZZ
          items:
            type: string
          minItems: 1
          type: array
        hamiltonian_weights:
          example:
          - -0.5
          - 1
          - 2.44
          - 5
          items:
            type: number
          minItems: 1
          type: array
        max_iterations:
          default: 200
          minimum: 1
          type:
          - integer
          - 'null'
        platform_name:
          example: sim:gpu:medium
          type: string
      required:
      - hamiltonian_strings
      - hamiltonian_weights
      - platform_name
      type: object
    CVarVQEJobResult:
      additionalProperties: false
      properties:
        duration:
          description: Duration in seconds
          example: 42
          type: integer
        intermediate_results:
          description: Results with timestamps
          items:
            $ref: '#/components/schemas/IntermediateCVarVqeResults'
          type: array
        job_id:
          type: string
        progress:
          example: 0.7
          type: number
        progress_message:
          description: detailed message
          type: string
        results:
          $ref: '#/components/schemas/CVarVqeResults'
        status:
          description: Status code
          enum:
          - waiting
          - running
          - canceled
          - completed
          - error
          example: running
          type: string
        status_message:
          description: detailed message
          type: string
      required:
