cross_cutting_rules_every_skill_carries:
  - >-
    No idempotency exists on this API. `process_id` on POST /api/jobs is a
    uniqueness guard that 400s on collision, not an idempotent replay, and the
    Quantum Toolbox has no equivalent at all — so a blind retry after a timeout
    can consume credits twice.
  - >-
    HTTP 401 is overloaded. Quandela returns 401 for credit and platform-time
    exhaustion as well as for authentication failure, so an agent that handles
    401 by refreshing its credential will loop forever on "Not enough credits".
    Every skill branches on the `error` string.
  - >-
    No rate-limit headers and no 429. Concurrency ceilings surface as 400/403 and
    the concrete numbers are only available from GET /api/jobs/availability.
  - >-
    Errors are a vendor {detail, error} envelope with no machine-readable code —
    string matching on `error` is unavoidable.
  - >-
    Check GET /api/platforms/public (anonymous, undocumented) before submitting:
    on 2026-08-17 both published QPUs reported unreachable / maintenance.
